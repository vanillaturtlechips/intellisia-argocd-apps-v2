apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: intellisia-app-sa
      containers:
        - name: app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: url
            - name: S3_BUCKET_NAME
              value: "intellisia-storage-dev"
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: nextauth_secret
            - name: NEXTAUTH_URL
              value: "http://a7caf260a21b9433aa227d7589899a15-1108325404.ap-northeast-2.elb.amazonaws.com"